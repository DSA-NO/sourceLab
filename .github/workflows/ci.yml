name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (Geant4)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup micromamba environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: geant4-sourceLab
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          cache-environment-key: geant4-sourceLab-${{ hashFiles('environment.yml') }}
          cache-downloads: true

      - name: Toolchain info
        run: |
          micromamba run -n geant4-sourceLab cmake --version
          micromamba run -n geant4-sourceLab ninja --version
          micromamba run -n geant4-sourceLab geant4-config --version

      - name: Configure
        run: |
          micromamba run -n geant4-sourceLab bash -lc '
            cmake -S . -B build-ci -G Ninja \
              -DEXPAT_INCLUDE_DIR="$CONDA_PREFIX/include" \
              -DEXPAT_LIBRARY="$CONDA_PREFIX/lib/libexpat.so" \
              -DZLIB_INCLUDE_DIR="$CONDA_PREFIX/include" \
              -DZLIB_LIBRARY="$CONDA_PREFIX/lib/libz.so" \
              -DFREETYPE_INCLUDE_DIR="$CONDA_PREFIX/include" \
              -DFREETYPE_LIBRARY="$CONDA_PREFIX/lib/libfreetype.so"'

      - name: Build
        run: micromamba run -n geant4-sourceLab cmake --build build-ci --parallel

      - name: Smoke test (batch macro)
        working-directory: build-ci
        run: micromamba run -n geant4-sourceLab ./sourceLab -b run.mac
