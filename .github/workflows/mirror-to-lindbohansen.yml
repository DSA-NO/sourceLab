name: Mirror to lindbohansen/sourceLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-lindbohansen-sourceLab
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'DSA-NO/sourceLab'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone source repository as a bare mirror
        run: |
          git clone --bare . source-mirror.git

      - name: Mirror to lindbohansen/sourceLab
        env:
          SOURCELAB_MIRROR_PAT: ${{ secrets.SOURCELAB_MIRROR_PAT }}
        run: |
          if [[ -z "${SOURCELAB_MIRROR_PAT}" ]]; then
            echo "Missing SOURCELAB_MIRROR_PAT secret." >&2
            exit 1
          fi

          cd source-mirror.git
          git remote add mirror https://x-access-token:${SOURCELAB_MIRROR_PAT}@github.com/lindbohansen/sourceLab.git
          git push mirror +refs/heads/main:refs/heads/main
